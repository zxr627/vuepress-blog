name: Build and deploy VuePress to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zxroo-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Verify required public files
        run: |
          set -euo pipefail
          for file in \
            index.html \
            404.html \
            robots.txt \
            sitemap.xml \
            0752e0217f4f06edf6c758d09659d6da.txt
          do
            test -f "src/.vuepress/dist/${file}" || {
              echo "Missing required build output: ${file}" >&2
              exit 1
            }
          done

      - name: Package site
        run: tar -czf "${RUNNER_TEMP}/zxroo-site.tar.gz" -C src/.vuepress/dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zxroo-site-${{ github.sha }}
          path: ${{ runner.temp }}/zxroo-site.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: zxroo-site-${{ github.sha }}
          path: package

      - name: Configure pinned SSH connection
        env:
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${ECS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${ECS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Activate release and verify HTTPS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail
          remote_archive="/var/www/zxroo/incoming/${GITHUB_SHA}.tar.gz"
          ssh_target="${ECS_USER}@${ECS_HOST}"
          ssh_options=(
            -i "${HOME}/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -p "${ECS_PORT}"
          )

          scp \
            -i "${HOME}/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "${ECS_PORT}" \
            package/zxroo-site.tar.gz \
            "${ssh_target}:${remote_archive}"

          ssh "${ssh_options[@]}" "${ssh_target}" \
            "zxroo-deploy activate '${GITHUB_SHA}' '${remote_archive}'"

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://zxroo.top/ > /dev/null
          then
            ssh "${ssh_options[@]}" "${ssh_target}" "zxroo-deploy rollback"
            exit 1
          fi
